name: Fehler melden
description: Etwas funktioniert nicht wie erwartet.
labels: ["fehler"]
body:
  - type: markdown
    attributes:
      value: |
        Danke für die Meldung. Bitte keine Zugangsdaten, Server-Adressen oder
        Kontonamen eintragen; dieses Issue ist öffentlich. Sicherheitslücken
        bitte über den Weg in SECURITY.md melden.
  - type: textarea
    id: beobachtung
    attributes:
      label: Beobachtung
      description: Was ist passiert?
    validations:
      required: true
  - type: textarea
    id: erwartung
    attributes:
      label: Erwartung
      description: Was hättest du stattdessen erwartet?
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachvollziehen
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version des Providers
      placeholder: "z. B. 2.1.0 oder Image-Tag"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Audiobookshelf-Version
      placeholder: "z. B. 2.30.0"
  - type: input
    id: geraet
    attributes:
      label: Region und Suchbegriff
      description: Storytel-Region und der Titel oder die ISBN, mit denen es auftritt.
      placeholder: "z. B. de, „Der Schwarm“"
