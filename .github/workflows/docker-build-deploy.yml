name: Docker Build and Deploy

on:
  push:
    branches: [ master ]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v*.*.*'
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g. v1.0.0)'
        required: true
        type: string
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - development
          - staging
          - production
        default: 'development'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Live tests against the Storytel API (no mocks)
      - name: Run tests
        run: npm test

  image:
    needs: test
    uses: Revisor01/workflows/.github/workflows/docker-image.yml@5bb9fc1d9e2cd728029f334f50bbe355f005eef5 # 1.3.1
    permissions:
      contents: read
      packages: write
    with:
      image: ghcr.io/revisor01/abs-storytel-provider
      plattformen: linux/amd64,linux/arm64
      tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=sha
        type=raw,value=latest,enable={{is_default_branch}}
