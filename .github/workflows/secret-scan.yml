name: Secret-Scan

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    uses: Revisor01/workflows/.github/workflows/secret-scan.yml@5dbf43ce8713129d105d948b05870f5dfa8bf63a # 1.1.1
    secrets:
      GITLEAKS_EXTRA_RULES: ${{ secrets.GITLEAKS_EXTRA_RULES }}
