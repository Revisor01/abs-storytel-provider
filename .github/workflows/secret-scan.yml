name: Secret-Scan

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    uses: Revisor01/workflows/.github/workflows/secret-scan.yml@3ec878449b89e1a69714b87381cb8effd7075fef # 1.5.1
    secrets:
      GITLEAKS_EXTRA_RULES: ${{ secrets.GITLEAKS_EXTRA_RULES }}
