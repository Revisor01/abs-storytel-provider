name: Secret-Scan

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    uses: Revisor01/workflows/.github/workflows/secret-scan.yml@5bb9fc1d9e2cd728029f334f50bbe355f005eef5 # 1.3.1
    secrets:
      GITLEAKS_EXTRA_RULES: ${{ secrets.GITLEAKS_EXTRA_RULES }}
